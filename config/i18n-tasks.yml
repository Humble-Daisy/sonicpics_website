  yaml:
    write:
      line_width: -1

search:
  paths:
    - app/
  relative_roots:
    - app/controllers
    - app/helpers
    - app/mailers
    - app/views
    - app/components
    - app/notifiers
  exclude:
    - app/assets
    # Markdown served at /docs. Contains illustrative `t(".key")` snippets that
    # are documentation, not call sites.
    - app/docs
    # UI primitives mirrored from the modelrails_ui gem. Every t() in here
    # passes an inline `default:`, so an absent app key is intentional — a fork
    # adds one only to override the shipped wording.
    #
    # Excluded by PATH rather than by key namespace on purpose: `ui.*` is an
    # ordinary English word, and a fork writing t("ui.dashboard.header") in its
    # own view must still be gated.
    - app/components/ui

ignore_unused:
  # Consumed by the UI primitives under app/components/ui — that path is
  # excluded from the scanner ON PURPOSE (every t() there carries an inline
  # default; an app-level key IS the override), and the Lookbook preview
  # templates that exercise them live under spec/. Deleting these silently
  # reverts dialogs to the shipped English (#522 nearly did — 32 system
  # failures).
  - modals.close
  - modals.confirm
  - modals.delete
  - modals.save
  # config/locales/modelrails_ui.en.yml is the delegate-file for every
  # `modelrails_ui.*` key the gem's components call (see that file's header):
  # gem-shipped, host-owned, copied in WHOLE from the gem's install template
  # (B1 adoption) so every current AND future component has an override-ready
  # key, not just the ones this app has installed today. Consumers live under
  # app/components/ui, a path excluded from the scanner on purpose (every
  # t() there carries an inline `default:`, so an absent app key is
  # intentional — same reasoning as modals.* above); a few (e.g.
  # chat_bubble.sent/received) are also dynamic key lookups the static
  # scanner couldn't resolve even if the path weren't excluded. Deleting a
  # key here only degrades that component to its shipped English default.
  - modelrails_ui.*
  # Off-namespace legacy key (predates the modelrails_ui.* convention)
  # consumed by UI::BreadcrumbComponent under the scanner-excluded
  # app/components/ui — same reasoning as modals.* above. Defined so the
  # breadcrumb nav landmark name is translatable (W1 CP3).
  - ui.breadcrumb.label
  # Rendered by Settings::ConnectedAccountsController#verify through the
  # PendingClaims problems map (symbol -> key string in a constant hash),
  # a call form the static scanner cannot resolve. Both keys are exercised
  # by the connected_accounts verify request specs.
  - settings.connected_accounts.verify.email_mismatch
  - settings.connected_accounts.verify.join_link_at_capacity
  # Read at broadcast/announce time by ApplicationNotifier and the
  # notifications controller in call forms the static scanner misses;
  # deleting them turns the aria-live announcements into
  # MissingTranslationData at runtime.
  - notifications.bell.arrival_announcement
  - notifications.bell.read_state_announcement
  # Rendered via lazy/dynamic scopes the scanner cannot resolve; the system
  # and request specs assert the rendered labels/flashes, so the suite is
  # the working proof of use.
  - navigation.profile
  - settings.sidebar.items.invitations
  - workspaces.invitations.resends.create.recently_sent
  - workspaces.invitations.resends.create.resent
  # Resolved dynamically at runtime, so no static call site exists.
  - notification_mailer.digest.subject.*
  # Rendered via t(error.i18n_key) — each Passkeys::Error subclass derives its
  # own key from its class name (app/lib/passkeys/error.rb), so the scanner
  # sees no static reference. spec/lib/passkeys/errors_spec.rb pins every
  # key's existence, so a stale entry here still fails the suite.
  - passkeys.errors.*
  # activity_logs/_activity_log.html.erb builds the key from the record:
  #   t("activity.actions.#{activity_log.display_action}", default: action.humanize)
  # The `default:` is what makes this dangerous rather than merely invisible —
  # delete these and every feed entry silently degrades to a humanized column
  # value with nothing raising and the suite still green (#522).
  - activity.actions.*
  # AccountActivityHelper#account_activity_label builds the key the same
  # dynamic way from ActivityLog::SECURITY_ACTIONS entries, and appends
  # `_with_os` when the row carries one:
  #   t("settings.sessions.activity.#{entry.action}#{"_with_os" if os}", ...)
  # Same #522 risk as activity.actions.* above — the `default:` means a
  # deleted key silently degrades to a humanized action string.
  # spec/models/activity_log_spec.rb pins every SECURITY_ACTIONS key's
  # existence, so a stale entry here still fails the suite (same role as the
  # passkeys.errors.* spec above); the `_with_os` variant is not a
  # SECURITY_ACTIONS member and is pinned instead by its rendered text in
  # spec/requests/settings/sessions_spec.rb.
  - settings.sessions.activity.user.*
  # Same dynamic lookup, for the operatorship.granted/revoked pair — looked
  # up unconditionally by action even though admin visibility keeps these
  # rows off this particular (personal) page, same as above.
  - settings.sessions.activity.operatorship.*
  # Consumed by Rails/Active Model rather than an explicit t() call (errors.*
  # via full_message, attributes.* via human_attribute_name). Caveat worth
  # knowing: this also means a key left behind by a deleted validation or
  # renamed attribute will never be reported — removing it means removing
  # this key by hand.
  - activerecord.errors.*
  - activerecord.attributes.*
  - errors.*
  - helpers.*
  - date.*
  - time.*
  - number.*
  - support.*
  # Read by JS through the clientside translation bridge.
  - clientside.*

ignore_missing:
  # Mounted engines own these; the app carries no keys for them.
  - biscuit.*
  - markdowndocs.*
