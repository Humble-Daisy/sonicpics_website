    support:
      title: "Support"
      intro: "If you have a question about SonicPics, email"
      email: "support@sonicpics.com"
      email_label: "support@sonicpics.com"
      email_subject: "SonicPics Support"
      faqs_title: "Frequently asked questions"
      location:
        question: "Why does SonicPics need access to my location data?"
        answer: "When you add images from your device library for the first time, your device may ask you to allow access to location data. Photos in your library may contain location information. SonicPics does not read or use that information. Apple requires Location Services to be enabled for SonicPics so the app can access photos from your Photo Library."
        link: "Apple's Understanding Location Services"
        url: "https://support.apple.com/kb/HT1975"
      photos:
        question: "How do I give SonicPics permission to access my photos?"
        location_steps: "Make sure Location Services is enabled for SonicPics. Select Settings, then Privacy, then Location Services. Make sure Location Services is on for SonicPics."
        photo_steps: "Make sure you have granted SonicPics access to your photos. Select Settings, then Privacy, then Photos. Make sure the toggle next to SonicPics is on."
      saving:
        question: "My recording never finishes saving."
        answer: "This can happen if you leave SonicPics during rendering. To restart rendering, force SonicPics to quit and then reopen it."
      sharing:
        question: "How can I share my recording?"
        answer: "Recordings under 10MB can be shared via email. Larger recordings can be shared via local wifi, to download to a computer, to YouTube, or to the camera roll on the device so they can sync with a computer. The 10MB email limit is a SonicPics restriction. Many school districts cap email attachments at 10MB."
      youtube_timing:
        question: "When I upload my recording to YouTube the timing is off. Can I fix this?"
        answer: "YouTube reprocesses videos that are submitted to it. That reprocessing has thrown off the timing on some SonicPics recordings. Update to the latest version of SonicPics and resubmit your video."
      youtube_account:
        question: "I am getting a no linked account error when trying to share a recording to YouTube. Can you fix this?"
        answer: "We can't support Google or YouTube accounts. Google owns YouTube. Support from Google is here."
        link: "YouTube account support"
        url: "https://support.google.com/youtube/topic/3024171?hl=en&ref_topic=3024169"
    privacy:
      title: "SonicPics Privacy Policy"
      intro: "Humble Daisy, Inc takes the privacy of our users seriously. We do not collect information we do not need to operate our applications and services."
      updated: "Last updated"
      does_not_title: "In short, we do not"
      does_not:
        - "Collect personally identifiable information such as email addresses or usernames for the apps covered by this policy."
        - "Sell, share, or use collected user information for any purpose other than to improve the service."
      successor: "In the event of a change of control, such as a sale of Humble Daisy, Inc or of a product covered by this policy, the successor entity is subject to these same privacy commitments for any previously collected information."
      website_title: "SonicPics website privacy policy"
      website_updated: "Last updated: April 9, 2015"
      website_intro: "Humble Daisy, Inc (\"us\", \"we\", or \"our\") operates the http://www.sonicpics.com website (the \"Service\"). This page describes our policies on the collection, use, and disclosure of personal information when you use our Service. We will not use or share your information with anyone except as described in this privacy policy."
      app_title: "SonicPics app privacy policy"
      app_updated: "Last updated: April 8, 2015"
      app_intro: "Humble Daisy, Inc (\"us\", \"we\", or \"our\") operates the SonicPics mobile application (the \"Service\"). This page describes our policies on the collection, use, and disclosure of personal information when you use our Service."
      agreement: "We use your personal information to provide and improve the Service. By using the Service, you agree to the collection and use of information in accordance with this policy. Unless otherwise defined in this privacy policy, terms used here have the same meanings as in our terms and conditions."
      collection:
        title: "Information collection and use"
        items:
          - "While using our Service, we may ask you to provide personally identifiable information that can be used to contact or identify you. That information may include your email address, name, and other details (\"Personal Information\")."
          - "We collect this information to provide the Service, identify and communicate with you, respond to your requests, service purchase orders, and improve our services."
      usage:
        title: "Log data"
        items:
          - "We collect information that your browser sends whenever you visit our Service (\"Log Data\"). Log Data may include your computer's Internet Protocol (\"IP\") address, browser type, browser version, the pages you visit, the time and date of your visit, the time spent on those pages, and other statistics."
          - "We may use third party services such as Google Analytics that collect, monitor, and analyze this type of information in order to increase our Service's functionality. Those providers have their own privacy policies."
          - "When you access the Service through a mobile device, we may collect the type of mobile device you use, your device's unique device ID, the IP address of your mobile device, your mobile operating system, the type of mobile Internet browser you use, and other statistics."
      sharing:
        title: "Data sharing"
        description: "We do not sell your personal information. We share data only as necessary to provide the Service, comply with law or subpoena, or protect the security or integrity of the Service. Third parties we hire have access to personal information only to perform specific tasks on our behalf and are obligated not to disclose or use it for any other purpose."
      security:
        title: "Security"
        description: "The security of your personal information is important to us. We strive to implement and maintain reasonable, commercially acceptable security procedures and practices appropriate to the nature of the information we store, in order to protect it from unauthorized access, destruction, use, modification, or disclosure. No method of transmission over the internet, or method of electronic storage, is 100% secure, and we cannot guarantee absolute security."
      rights:
        title: "Your choices"
        items:
          - "You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent. If you do not accept cookies, you may not be able to use some features of our Service."
          - "You can enable or disable location services for the SonicPics app at any time through your mobile device settings."
          - "Our Service does not address anyone under the age of 13. We do not knowingly collect personally identifiable information from children under 13. If you are a parent or guardian and you learn that your child has provided us with personal information, contact us and we will take steps to remove it."
          - "Only persons age 18 or older have permission to access our website Service."
      cookies_title: "Cookies"
      cookies: "Cookies are files with a small amount of data, which may include an anonymous unique identifier. Cookies are sent to your browser from a website and stored on your device. We use cookies to collect information in order to improve our services for you."
      location_title: "Location information"
      location: "We may use and store information about your location depending on the permissions you have set on your device. We use this information to provide features of our Service and to improve and customize our Service. Photos in your library may contain location information. SonicPics does not read or use location data stored inside those photos. Apple requires Location Services to be enabled so the app can access your Photo Library."
      transfer_title: "International transfer"
      transfer: "Your information, including personal information, may be transferred to and maintained on computers located outside of your state, province, country, or other governmental jurisdiction, where data protection laws may differ. If you are located outside the United States and choose to provide information to us, we transfer the information, including personal information, to the United States and process it there. Your consent to this privacy policy followed by your submission of such information represents your agreement to that transfer."
      links_title: "Links to other sites"
      links: "Our Service may contain links to other sites that are not operated by us. If you click a third party link, you will be directed to that third party's site. We strongly advise you to review the privacy policy of every site you visit. We have no control over and assume no responsibility for the content, privacy policies, or practices of any third party sites or services."
      changes_title: "Changes to this privacy policy"
      changes: "This privacy policy is effective as of March 12, 2015 and will remain in effect except with respect to any changes in its provisions in the future, which will be in effect immediately after being posted on this page. We reserve the right to update or change our privacy policy at any time and you should check this privacy policy periodically. Your continued use of the Service after we post any modifications will constitute your acknowledgment of the modifications and your consent to abide and be bound by the modified privacy policy. If we make any material changes, we will notify you either through the email address you have provided us, or by placing a prominent notice on our website."
      contact_text: "If you have any questions about this privacy policy, please visit our"
      contact_link: "contact page"
