name: Deploy

# Setup (variables, environments, secrets): /docs/developer/deployment (Deploy from CI).
on:
  push:
    branches: [ main, "release/**" ]

concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'production' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.ref_name == 'main' && vars.DEPLOY_PRODUCTION == 'true') ||
      (startsWith(github.ref_name, 'release/') && vars.DEPLOY_STAGING == 'true')
    # The server is arm64: an arm64 runner builds natively, with no remote builder.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install fnox
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: fnox

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Load the deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
          DESTINATION: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          if [ "$DESTINATION" = staging ]; then bin/kamal deploy -d staging; else bin/kamal deploy; fi
